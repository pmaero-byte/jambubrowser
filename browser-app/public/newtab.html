<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab — Jambubrowser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
    color: #e0e0e0;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 60px 20px;
  }
  .logo { font-size: 48px; margin-bottom: 30px; opacity: 0.9; }
  .title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #a78bfa; }
  .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 32px; }
  .search-box {
    display: flex; align-items: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 10px 16px;
    width: 100%; max-width: 560px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box:focus-within {
    border-color: rgba(167,139,250,0.5);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.1);
  }
  .search-box input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #e0e0e0; font-size: 15px;
  }
  .search-box input::placeholder { color: #4b5563; }
  .shortcuts { display: flex; gap: 12px; margin-top: 40px; flex-wrap: wrap; justify-content: center; max-width: 600px; }
  .shortcut {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 80px; padding: 12px 8px; border-radius: 10px;
    background: rgba(255,255,255,0.04); border: 1px solid transparent;
    cursor: pointer; text-decoration: none; color: #9ca3af;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .shortcut:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); color: #e0e0e0; }
  .shortcut .icon { font-size: 24px; }
  .shortcut .label { font-size: 11px; text-align: center; word-break: break-word; }
  .status {
    margin-top: 48px; font-size: 11px; color: #374151;
    display: flex; align-items: center; gap: 6px;
  }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
</style>
</head>
<body>
  <div class="logo">🛡️</div>
  <div class="title">Jambubrowser</div>
  <div class="subtitle">Private. Autonomous. Sovereign.</div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search or enter URL" autofocus
      onkeydown="if(event.key==='Enter'){const v=document.getElementById('search').value.trim();if(v){const u=v.includes('.')&&!v.includes(' ')?'https://'+v:'https://www.google.com/search?q='+encodeURIComponent(v);window.location.href=u;}}">
  </div>

  <div class="shortcuts">
    <a class="shortcut" href="https://github.com">
      <span class="icon">📦</span><span class="label">GitHub</span>
    </a>
    <a class="shortcut" href="https://news.ycombinator.com">
      <span class="icon">📰</span><span class="label">Hacker News</span>
    </a>
    <a class="shortcut" href="https://arxiv.org">
      <span class="icon">📚</span><span class="label">arXiv</span>
    </a>
    <a class="shortcut" href="https://www.google.com/maps">
      <span class="icon">🗺️</span><span class="label">Maps</span>
    </a>
    <a class="shortcut" href="https://www.youtube.com">
      <span class="icon">▶️</span><span class="label">YouTube</span>
    </a>
    <a class="shortcut" href="https://chat.openai.com">
      <span class="icon">🤖</span><span class="label">ChatGPT</span>
    </a>
  </div>

  <div class="status">
    <span class="dot"></span> Ad blocking + fingerprint protection active
  </div>
</body>
</html>
