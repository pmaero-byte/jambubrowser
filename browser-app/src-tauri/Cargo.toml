[package]
name = "browser-app"
version = "0.1.0"
description = "Jambubrowser — Sovereign Autonomous Research Agent"
authors = ["Jambu AI <hi@jambu.ai>"]
license = "MIT"
repository = "https://github.com/pmaero-byte/jambubrowser"
homepage = "https://github.com/pmaero-byte/jambubrowser"
edition = "2021"
rust-version = "1.77"

[lib]
name = "browser_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
