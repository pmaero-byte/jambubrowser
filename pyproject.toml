[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jambubrowser"
version = "3.3.0"
description = "Jambubrowser — AI-employee web audit & autonomous research engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pmaero-byte" }]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "starlette>=0.27.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
    "httpx-socks[asyncio]>=0.7.7",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "sqlite-vec>=0.1.0",
    "cryptography>=41.0.0",
    "markdownify>=0.11.0",
    "mcp>=1.0.0,<2.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "anyio>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
# Local LLM inference on Apple Silicon. Lives in its own venv (mlx-venv)
# because it requires Python 3.11+. Not part of the base install.
mlx = ["mlx-lm", "mlx-vlm"]

[project.scripts]
jambu = "cli.jambu:main"

[tool.setuptools]
packages = ["backend", "cli"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
