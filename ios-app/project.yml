name: Jambubrowser
options:
  bundleIdPrefix: com.jambubrowser
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
targets:
  JambubrowserKit:
    type: framework
    platform: iOS
    sources:
      - path: JambubrowserKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jambubrowser.kit
        PRODUCT_NAME: JambubrowserKit
        GENERATE_INFOPLIST_FILE: YES
  Jambubrowser:
    type: application
    platform: iOS
    sources:
      - path: Jambubrowser
    dependencies:
      - target: JambubrowserKit
    info:
      path: Jambubrowser/Info.plist
      properties:
        CFBundleDisplayName: Jambubrowser
        CFBundleShortVersionString: "3.4.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.jambubrowser.ios.connector-health-refresh
          - com.jambubrowser.ios.session-sync
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - jambubrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jambubrowser.ios
        PRODUCT_NAME: Jambubrowser
