version: '3.8'

services:
  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng-net
    volumes:
      - valkey-data:/data

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng-net
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    depends_on:
      - redis

  # Phase 1: Sandboxed code execution container
  sandbox:
    container_name: jambu_sandbox
    image: python:3.11-slim
    restart: "no"
    networks:
      - searxng-net
    volumes:
      - sandbox-code:/code:ro
      - sandbox-tmp:/tmp:rw
    command: python -c "print('Jambu Sandbox ready')"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 256m
    cpus: 1

  # Test runner for CI
  test-runner:
    container_name: jambu_test
    image: python:3.11-slim
    restart: "no"
    networks:
      - searxng-net
    volumes:
      - .:/app:rw
    working_dir: /app
    command: >
      sh -c "
        pip install pytest pytest-asyncio httpx cryptography psutil fastapi uvicorn pydantic sentence-transformers numpy sqlite-vec crawl4ai &&
        cd /app &&
        python -m pytest tests/ -v --tb=short
      "
    environment:
      - JAMBU_DB_PATH=:memory:
      - JAMBU_VAULT_KEY=test-key-do-not-use-in-production-32bytes!
    profiles:
      - test

networks:
  searxng-net:
    driver: bridge

volumes:
  valkey-data:
  sandbox-code:
  sandbox-tmp:
