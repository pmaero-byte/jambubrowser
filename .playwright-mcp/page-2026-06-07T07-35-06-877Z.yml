                    - generic [ref=f3e357]:
                      - link "The Astronomer" [ref=f3e359] [cursor=pointer]:
                        - /url: /wiki/File:Johannes_Vermeer_-_The_Astronomer_-_1668.jpg
                        - img "The Astronomer" [ref=f3e360]
                      - paragraph [ref=f3e361]:
                        - link "The Astronomer" [ref=f3e364] [cursor=pointer]:
                          - /url: /wiki/The_Astronomer
                        - text: is an oil painting on canvas by the
                        - link "Dutch Golden Age" [ref=f3e365] [cursor=pointer]:
                          - /url: /wiki/Dutch_Golden_Age_painting
                        - text: artist
                        - link "Johannes Vermeer" [ref=f3e366] [cursor=pointer]:
                          - /url: /wiki/Johannes_Vermeer
                        - text: ", completed in 1668. The work depicts an"
                        - link "astronomer" [ref=f3e367] [cursor=pointer]:
                          - /url: /wiki/Astronomer
                        - text: studying a
                        - link "celestial globe" [ref=f3e368] [cursor=pointer]:
                          - /url: /wiki/Celestial_globe
                        - text: beside a copy of
                        - link "Adriaan Metius" [ref=f3e369] [cursor=pointer]:
                          - /url: /wiki/Adriaan_Metius
                        - text: "'s"
                        - generic "Latin-language text" [ref=f3e370]: Institutiones Astronomicae Geographicae
                        - text: . Closely related to Vermeer's
                        - link "The Geographer" [ref=f3e372] [cursor=pointer]:
                          - /url: /wiki/The_Geographer
                        - text: ", it is thought to portray the same sitter, possibly"
                        - link "Antonie van Leeuwenhoek" [ref=f3e373] [cursor=pointer]:
                          - /url: /wiki/Antonie_van_Leeuwenhoek
                        - text: ; a 2017 study showed that both paintings were made from canvas cut from the same bolt. The painting was seized by the
                        - link "Nazis" [ref=f3e374] [cursor=pointer]:
                          - /url: /wiki/Nazism
                        - text: from the
                        - link "Rothschild family" [ref=f3e375] [cursor=pointer]:
                          - /url: /wiki/Rothschild_family
                        - text: during the Second World War, returned to them when the war concluded, and acquired by the French state in 1983. It is now in the collection of the
                        - link "Louvre" [ref=f3e376] [cursor=pointer]:
                          - /url: /wiki/Louvre
                        - text: in Paris.
