                        - paragraph [ref=f9e169]:
                          - link "Voss" [ref=f9e172] [cursor=pointer]:
                            - /url: /wiki/Voss_(collection)
                          - text: is the seventeenth collection by British fashion designer
                          - link "Alexander McQueen" [ref=f9e173] [cursor=pointer]:
                            - /url: /wiki/Alexander_McQueen
                          - text: ", made for the Spring/Summer 2001 season of"
                          - link "his fashion house" [ref=f9e174] [cursor=pointer]:
                            - /url: /wiki/Alexander_McQueen_(fashion_house)
                          - text: . Voss drew on imagery of madness and nature to question beauty standards and critique the fashion industry, with showpiece designs made from unusual materials such as razor clam shells (dress pictured), an antique Japanese screen, and microscope slides. The
                          - link "runway show" [ref=f9e175] [cursor=pointer]:
                            - /url: /wiki/Fashion_show
                          - text: was staged on 26 September 2000 in London, inside a room-sized mirrored glass cube, the audience seated outside. The interior was styled to look like an insane asylum and models were directed to act unwell. In the finale, a glass cube inside shattered to reveal
                          - link "Michelle Olley" [ref=f9e176] [cursor=pointer]:
                            - /url: /wiki/Michelle_Olley
                          - text: ", fat, nude, and covered in moths. Critical response was positive, especially towards the showpieces and the"
                          - link "performance art" [ref=f9e177] [cursor=pointer]:
                            - /url: /wiki/Performance_art
                          - text: aspect. The show is regarded as one of McQueen's best, and has attracted a large amount of academic analysis. Several ensembles appeared in the retrospective
                          - 'link "Alexander McQueen: Savage Beauty" [ref=f9e179] [cursor=pointer]':
                            - /url: /wiki/Alexander_McQueen:_Savage_Beauty
                          - text: .
