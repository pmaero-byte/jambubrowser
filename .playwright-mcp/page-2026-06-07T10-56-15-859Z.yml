                        - img "The Astronomer" [ref=f8e416]
                      - paragraph [ref=f8e417]:
                        - link "The Astronomer" [ref=f8e420] [cursor=pointer]:
                          - /url: /wiki/The_Astronomer
                        - text: is an oil painting on canvas by the
                        - link "Dutch Golden Age" [ref=f8e421] [cursor=pointer]:
                          - /url: /wiki/Dutch_Golden_Age_painting
                        - text: artist
                        - link "Johannes Vermeer" [ref=f8e422] [cursor=pointer]:
                          - /url: /wiki/Johannes_Vermeer
                        - text: ", completed in 1668. The work depicts an"
                        - link "astronomer" [ref=f8e423] [cursor=pointer]:
                          - /url: /wiki/Astronomer
                        - text: studying a
                        - link "celestial globe" [ref=f8e424] [cursor=pointer]:
                          - /url: /wiki/Celestial_globe
                        - text: beside a copy of
                        - link "Adriaan Metius" [ref=f8e425] [cursor=pointer]:
                          - /url: /wiki/Adriaan_Metius
                        - text: "'s"
                        - generic "Latin-language text" [ref=f8e426]: Institutiones Astronomicae Geographicae
                        - text: . Closely related to Vermeer's
                        - link "The Geographer" [ref=f8e428] [cursor=pointer]:
                          - /url: /wiki/The_Geographer
                        - text: ", it is thought to portray the same sitter, possibly"
                        - link "Antonie van Leeuwenhoek" [ref=f8e429] [cursor=pointer]:
                          - /url: /wiki/Antonie_van_Leeuwenhoek
                        - text: ; a 2017 study showed that both paintings were made from canvas cut from the same bolt. The painting was seized by the
                        - link "Nazis" [ref=f8e430] [cursor=pointer]:
                          - /url: /wiki/Nazism
                        - text: from the
                        - link "Rothschild family" [ref=f8e431] [cursor=pointer]:
                          - /url: /wiki/Rothschild_family
                        - text: during the Second World War, returned to them when the war concluded, and acquired by the French state in 1983. It is now in the collection of the
                        - link "Louvre" [ref=f8e432] [cursor=pointer]:
                          - /url: /wiki/Louvre
                        - text: in Paris.
