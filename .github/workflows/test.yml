name: test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install fastapi uvicorn[standard] pydantic httpx psutil pycryptodome sentence-transformers sqlite-vec pytest pytest-asyncio anyio websockets

      - name: Run unit + integration tests
        env:
          JAMBU_DB_PATH: ":memory:"
          JAMBU_VAULT_KEY: "test-key-do-not-use-in-production-32bytes!"
          JAMBU_LLM_PROVIDER: mock
        run: |
          # Core modules
          python -m pytest tests/test_backend.py tests/test_llm_layer.py tests/test_memory_system.py tests/test_agent_loop.py -v --tb=short -x
          # Security middleware stack (9 test files)
          python -m pytest tests/test_security_headers.py tests/test_body_size_limit.py tests/test_trusted_host.py tests/test_request_id.py tests/test_error_sanitization.py tests/test_request_timeout.py tests/test_security_events.py tests/test_access_log.py tests/test_core_security.py -v --tb=short -x
          # Security-focused feature modules
          python -m pytest tests/test_calculator.py tests/test_audit_redaction.py tests/test_privacy.py tests/test_supply_chain.py -v --tb=short -x
          # Engine runtime + deferred
          python -m pytest tests/test_engine_runtime.py tests/test_deferred.py tests/test_health_endpoint.py tests/test_form_filler.py tests/test_exec_request.py -v --tb=short -x
          # MCP server (stdio smoke + schema snapshot; skip live-e2e which needs running engine)
          python -m pytest tests/test_mcp_server.py::test_mcp_stdio_smoke tests/test_mcp_server.py::test_mcp_tool_schema_snapshot -v --tb=short -x
          # Other modules (eval, moa, knowledge graph, CLI, etc.)
          python -m pytest tests/test_moa.py tests/test_knowledge_graph.py tests/test_response_cache.py tests/test_mission_diff.py tests/test_proxy_log.py -v --tb=short -x
          # Eval + CLI (headless, no live services needed)
          python -m pytest tests/test_eval.py tests/test_eval_cli.py tests/test_cli_jambu.py tests/test_mcp_docs_generator.py -v --tb=short -x
          # AI Employee tests (6 specialist auditors, base classes, parsing)
          python -m pytest tests/test_employees.py -v --tb=short -x

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: browser-app/package-lock.json

      - name: Install + build + lint + test
        working-directory: browser-app
        run: |
          npm ci || npm install
          npm run typecheck
          npm run lint
          npm test
          npm run build

  backend-integration:
    name: Backend integration (live API)
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] pydantic httpx psutil pycryptodome pytest pytest-asyncio

      - name: Run integration tests
        env:
          JAMBU_DB_PATH: ":memory:"
          JAMBU_VAULT_KEY: "test-key-do-not-use-in-production-32bytes!"
          JAMBU_LLM_PROVIDER: mock
        run: |
          # These tests use FastAPI TestClient (no live server needed)
          python -m pytest tests/test_engine.py -v --tb=short -x

  lint:
    name: Lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: |
          ruff check backend/ || echo "::warning::Ruff issues found"
          ruff format --check backend/ || echo "::warning::Format issues found"

      - name: TypeScript check
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: browser-app/package-lock.json

      - name: tsc
        working-directory: browser-app
        run: npx tsc --noEmit
