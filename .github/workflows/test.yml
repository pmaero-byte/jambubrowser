name: test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install fastapi uvicorn[standard] pydantic httpx psutil pycryptodome sentence-transformers pytest pytest-asyncio anyio websockets

      - name: Run unit + integration tests
        env:
          JAMBU_DB_PATH: ":memory:"
          JAMBU_VAULT_KEY: "test-key-do-not-use-in-production-32bytes!"
          JAMBU_LLM_PROVIDER: mock
        run: |
          python -m pytest tests/test_backend.py tests/test_llm_layer.py tests/test_memory_system.py tests/test_agent_loop.py -v --tb=short

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/jambubrowser-ui/package-lock.json

      - name: Install + build
        working-directory: frontend/jambubrowser-ui
        run: |
          npm ci || npm install
          npm run build

  backend-integration:
    name: Backend integration (live API)
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] pydantic httpx psutil pycryptodome pytest pytest-asyncio

      - name: Run integration tests
        env:
          JAMBU_DB_PATH: ":memory:"
          JAMBU_VAULT_KEY: "test-key-do-not-use-in-production-32bytes!"
          JAMBU_LLM_PROVIDER: mock
        run: |
          # These tests use FastAPI TestClient (no live server needed)
          python -m pytest tests/test_engine.py -v --tb=short -x

  lint:
    name: Lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: |
          ruff check backend/ || echo "::warning::Ruff issues found"
          ruff format --check backend/ || echo "::warning::Format issues found"

      - name: TypeScript check
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/jambubrowser-ui/package-lock.json

      - name: tsc
        working-directory: frontend/jambubrowser-ui
        run: npx tsc --noEmit
